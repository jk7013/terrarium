services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: terrarium-pgvector
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-terrarium}
      POSTGRES_USER: ${POSTGRES_USER:-terrarium}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-terrarium}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - terrarium_pgdata:/var/lib/postgresql/data
      - ../app/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-terrarium} -d ${POSTGRES_DB:-terrarium}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: terrarium-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-bge-m3}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-terrarium}
      DB_USER: ${POSTGRES_USER:-terrarium}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-terrarium}
      RAG_TOP_K: ${RAG_TOP_K:-6}
      RAG_MAX_CONTEXT_CHARS: ${RAG_MAX_CONTEXT_CHARS:-6000}
    ports:
      - "9000:9000"

volumes:
  terrarium_pgdata:
